# Local development only: PostgreSQL and Redis for the API. Credentials match api/.env.example.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bugwatcher_pings
      POSTGRES_USER: bugwatcher_pings
      POSTGRES_PASSWORD: change-me
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bugwatcher_pings']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
